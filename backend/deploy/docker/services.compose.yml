name: dataset

volumes:

  postgres_volume:
    name: dataset_pg_volume

  files_volume:
    name: dataset_files_volume

  backup_volume:
    name: dataset_backup_volume

networks:

  dataset_network:
    name: dataset_network
    driver: bridge
    # A fixed range lets the web container keep the address the backend trusts.
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.97.0/24}

services:

  postgres:

    container_name: dataset_postgres
    image: dataset_postgres
    hostname: postgres
    build:
      context: ./postgres
      dockerfile: Dockerfile
    restart: always
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    command: >
      postgres
      -p ${POSTGRES_PORT}
      -c shared_preload_libraries='pg_cron'
      -c cron.database_name='${POSTGRES_BASE}'
    ports:
      - 127.0.0.1:${POSTGRES_PORT}:${POSTGRES_PORT}  # host tools only; never publish publicly
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=${POSTGRES_BASE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASS}
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_BASE} -p ${POSTGRES_PORT}'" ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 1s
      start_interval: 2s
    networks:
      - dataset_network

  # Daily dump of the database and the attached files, kept BACKUP_KEEP_DAYS days.
  # Copy dataset_backup_volume off this host: a backup on the same disk dies with it.
  backup:

    container_name: dataset_backup
    image: dataset_postgres
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          stamp=$$(date +%Y%m%d-%H%M%S)
          if pg_dump -Fc -h postgres -p "$$POSTGRES_PORT" -U "$$POSTGRES_USER" -d "$$POSTGRES_BASE" -f "/backups/db-$$stamp.part"; then
            mv "/backups/db-$$stamp.part" "/backups/db-$$stamp.dump"
            tar -czf "/backups/files-$$stamp.tar.gz" -C /files . && echo "backup $$stamp done"
          else
            echo "backup $$stamp FAILED"
          fi
          find /backups -type f -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep 86400
        done
    environment:
      - TZ=${TZ}
      - PGPASSWORD=${POSTGRES_PASS}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_BASE=${POSTGRES_BASE}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-7}
    volumes:
      - backup_volume:/backups
      - files_volume:/files:ro
    networks:
      - dataset_network
    depends_on:
      postgres:
        condition: service_healthy

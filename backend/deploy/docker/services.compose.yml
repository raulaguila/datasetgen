name: dataset

volumes:

  postgres_volume:
    name: dataset_pg_volume

  files_volume:
    name: dataset_files_volume

  backup_volume:
    name: dataset_backup_volume

networks:

  dataset_network:
    name: dataset_network
    driver: bridge
    # A fixed range lets the web container keep the address the backend trusts.
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.97.0/24}

services:

  postgres:

    container_name: dataset_postgres
    image: dataset_postgres
    hostname: postgres
    build:
      context: ./postgres
      dockerfile: Dockerfile
    restart: always
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    command: >
      postgres
      -p ${POSTGRES_PORT}
      -c shared_preload_libraries='pg_cron'
      -c cron.database_name='${POSTGRES_BASE}'
    ports:
      - 127.0.0.1:${POSTGRES_PORT}:${POSTGRES_PORT}  # host tools only; never publish publicly
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=${POSTGRES_BASE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASS}
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_BASE} -p ${POSTGRES_PORT}'" ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 1s
      start_interval: 2s
    networks:
      - dataset_network

  # Daily dump of the database and the attached files, each restored into a
  # scratch database to prove it works, kept BACKUP_KEEP_DAYS days (backup.sh).
  # BACKUP_DIR set to a host folder (an external disk, a synced or network
  # folder) puts the backups off this disk: a backup on the same disk dies with it.
  backup:

    container_name: dataset_backup
    image: dataset_postgres
    restart: always
    entrypoint: ["/bin/sh", "/backup.sh"]
    command: ["loop"]
    environment:
      - TZ=${TZ}
      - PGPASSWORD=${POSTGRES_PASS}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_BASE=${POSTGRES_BASE}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ${BACKUP_DIR:-backup_volume}:/backups
      - files_volume:/files:ro
      - ./backup.sh:/backup.sh:ro
    networks:
      - dataset_network
    depends_on:
      postgres:
        condition: service_healthy
